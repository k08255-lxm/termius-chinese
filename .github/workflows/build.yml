name: Build Release Files

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "pyinstaller>=6.10,<7"
    - name: Build executable
      run: pyinstaller --noconfirm --clean --onefile --windowed --name termius_chinese termius_chinese.py
    - name: Smoke test executable
      shell: pwsh
      run: |
        $process = Start-Process -FilePath .\dist\termius_chinese.exe -ArgumentList '--health-check' -Wait -PassThru
        if ($process.ExitCode -ne 0) { exit $process.ExitCode }
    - name: Upload executable to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" dist/termius_chinese.exe --clobber
    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: termius_chinese_windows
        path: dist/termius_chinese.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "pyinstaller>=6.10,<7"
    - name: Build executable
      run: pyinstaller --noconfirm --clean --onefile --name termius_chinese-linux termius_chinese.py
    - name: Smoke test executable
      run: ./dist/termius_chinese-linux --health-check
    - name: Upload files to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" dist/termius_chinese-linux termius_chinese.py --clobber
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: termius_chinese_linux
        path: |
          dist/termius_chinese-linux
          termius_chinese.py
